services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      # Demo credentials for local evaluation only. Override via a .env file
      # (SQL_SA_PASSWORD=...) or environment variable if desired.
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:-LocalDev!Passw0rd}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__LoanManagementDb: "Server=sqlserver,1433;Database=FundoLoanManagement;User Id=sa;Password=${SQL_SA_PASSWORD:-LocalDev!Passw0rd};TrustServerCertificate=True"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: on-failure

volumes:
  sqlserver-data:
